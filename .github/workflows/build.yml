name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android-and-jvm:
    name: Android, JVM and JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared module tests (Android unit tests run commonTest + androidUnitTest)
        run: ./gradlew :shared:testDebugUnitTest
      - name: Android app
        run: ./gradlew :androidApp:assembleDebug
      - name: Structure lab (Q7, Q8, Q12)
        run: >
          ./gradlew
          :structure-lab:printSourceSets
          :structure-lab:jvmTest
          :structure-lab:compileKotlinJs

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared iOS tests (commonTest + iosTest on the simulator)
        run: ./gradlew :shared:iosSimulatorArm64Test
      - name: Shared iOS framework and structure-lab iOS targets
        run: >
          ./gradlew
          :shared:linkDebugFrameworkIosArm64
          :structure-lab:compileKotlinIosArm64
